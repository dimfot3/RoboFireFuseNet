# loss and optimization
LR: 0.001
BATCHSIZE: 10
EPOCHS: 250
OPTIM: 'ADAM'
SCHED: 'POLY'
USE_OHEM: False
OHEMTHRES: 0.9
OHEMKEEP: 131072
WD: 0.0000012
MOMENTUM: 0.9
NESTEROV: false
BALANCE_WEIGHTS: [0.4, 1.0]
T_THRESH_BDLOSS: 0.8
BD_WEIGHT: 1.0
SB_WEIGHTS: 1.0
