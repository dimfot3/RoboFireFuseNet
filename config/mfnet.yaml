# corsican params
# general
PROJECTNAME: 'mfnet'
SESSIONAME: 'mfnet_pidnets'
DEVICE: 'cuda:0'
NUM_WORKERS: 8
ONLINELOG: False
SEED: 200
STOPCOUNTER: 12
VALID_FREQ: 2
WARMUP: 20
# model
MODEL: 'pidnet_s'
NUM_OUTPUTS: 2
PRETRAINED: 'weights/PIDNet_S_ImageNet.pth.tar'
CHECKPOINT: null
# data
TRAINSET: 'lists/train_mfnet.txt'
VALIDSET: 'lists/test_mfnet.txt'
